name: Deploy school app to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: school-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
        working-directory: webapp
      - run: npm run test:engine
        working-directory: webapp
      - run: npm run build:school
        working-directory: webapp
        env:
          VITE_DEPLOYMENT_TARGET: school
          VITE_BASE_PATH: /smart-notebook-converter-school/
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.SCHOOL_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_API_KEY: ${{ secrets.SCHOOL_GOOGLE_API_KEY }}
          VITE_GOOGLE_APP_ID: ${{ secrets.SCHOOL_GOOGLE_APP_ID }}
          VITE_GOOGLE_SITE_VERIFICATION: ${{ secrets.SCHOOL_GOOGLE_SITE_VERIFICATION }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webapp/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
